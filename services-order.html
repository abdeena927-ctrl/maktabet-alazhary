<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب خدمة إلكترونية | مكتبة الأزهري</title><link rel="stylesheet" href="style.css?v=8888"></head><body>
<style>
    .form-section { padding: 60px 0; background: #f8fafc; font-family: 'Cairo', sans-serif; }
    .form-box { max-width: 650px; margin: 0 auto; background: #ffffff; padding: 40px 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-top: 5px solid #0056b3; }
    .form-box h2 { font-size: 26px; color: #0f172a; margin-bottom: 10px; font-weight: 700; text-align: center; }
    .form-box p { color: #64748b; font-size: 15px; margin-bottom: 30px; text-align: center; }
    .order-form { display: flex; flex-direction: column; gap: 20px; text-align: right; }
    .order-form label { font-weight: 600; color: #0f172a; font-size: 15px; display: block; margin-bottom: 8px; }
    .order-form input, .order-form select, .order-form textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; font-family: inherit; }
    .order-form input:focus, .order-form select:focus, .order-form textarea:focus { border-color: #0056b3; box-shadow: 0 0 0 3px rgba(0,86,179,0.1); }
    .btn-submit { background: #ffcc00; color: #0f172a; border: none; font-weight: 700; padding: 14px; border-radius: 8px; cursor: pointer; font-size: 16px; transition: background 0.3s; width: 100%; margin-top: 15px; text-align: center; display: block; text-decoration: none; }
    .btn-submit:hover { background: #e6b800; }
</style>

<header><div class="container nav"><a class="brand" href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none;"><img src="logo.jpg?v=999" alt="لوجو مكتبة الأزهري" style="height: 45px; width: auto; object-fit: contain;"><div>مكتبة <span style="color: #0056b3; font-weight: bold;">الأزهري</span></div></a><nav><a href="index.html">الرئيسية</a><a href="services.html">خدماتنا</a><a href="books.html">الكتب والأدوات</a><a href="offers.html">العروض</a><a href="contact.html">تواصل معنا</a></nav></div></header>

<main class="form-section">
    <div class="container">
        <div class="form-box">
            <h2>📝 تقديم طلب خدمة إلكترونية</h2>
            <p>برجاء ملء البيانات التالية بدقة لتنفيذ الخدمة المطلوبة ومتابعتها معك فوراً</p>
            
            <form class="order-form" onsubmit="sendServiceOrder(event)">
                <div>
                    <label>الاسم رباعي:</label>
                    <input type="text" id="fullName" placeholder="اكتب اسمك رباعي كما في البطاقة" required>
                </div>
                <div>
                    <label>الرقم القومي (14 رقم):</label>
                    <input type="text" id="nationalId" placeholder="اكتب الرقم القومي الخاص بك" maxlength="14" pattern="\d{14}" title="يجب إدخال 14 رقم بالضبط" required>
                </div>
                <div>
                    <label>العنوان بالكامل:</label>
                    <input type="text" id="address" placeholder="المحافظة - المنطقة - اسم الشارع - رقم العقار" required>
                </div>
                <div>
                    <label>نوع الخدمة الإلكترونية:</label>
                    <select id="serviceType">
                        <option value="تقديمات مدارس وجامعات">تقديمات مدارس وجامعات</option>
                        <option value="خدمات حكومية وتذاكر">خدمات بوابة مصر الرقمية والحكومية</option>
                        <option value="دفع إلكتروني وتحويلات">دفع فواتير وتحويلات مالية</option>
                        <option value="كتابة وتنسيق أبحاث">كتابة ملفات Word وأبحاث طلابية</option>
                        <option value="خدمة أخرى">خدمة أخرى (اكتبها في الملاحظات)</option>
                    </select>
                </div>
                <div>
                    <label>تفاصيل وبيانات أخرى إضافية للمهمة:</label>
                    <textarea id="additionalData" rows="4" placeholder="اكتب هنا أي بيانات إضافية (مثل: اسم الكلية، رقم الهاتف الآخر، تفاصيل المعاملة الحسابية وغيرها)"></textarea>
                </div>
                
                <button type="submit" class="btn-submit">إرسال البيانات عبر واتساب لبدء الخدمة 🚀</button>
            </form>
        </div>
    </div>
</main>

<script>
function sendServiceOrder(event) {
    event.preventDefault();
    var name = document.getElementById('fullName').value;
    var id = document.getElementById('nationalId').value;
    var addr = document.getElementById('address').value;
    var type = document.getElementById('serviceType').value;
    var extra = document.getElementById('additionalData').value;
    
    var text = "مرحبًا مكتبة الأزهري، أريد تقديم طلب خدمة إلكترونية جديدة:\n\n" +
               "👤 الاسم رباعي: " + name + "\n" +
               "🪪 الرقم القومي: " + id + "\n" +
               "📍 العنوان: " + addr + "\n" +
               "✨ نوع الخدمة: " + type + "\n" +
               "📝 بيانات أخرى: " + (extra ? extra : "لا يوجد");
               
    var encodedText = encodeURIComponent(text);
    var whatsappUrl = "https://wa.me" + encodedText;
    window.open(whatsappUrl, '_blank');
}
</script>

<footer>© 2026 مكتبة الأزهري — جميع الحقوق محفوظة</footer></body></html>
