<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <!-- إضافة مكتبة أيقونات الأزرار الصحيحة والفعالة -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* تنسيق أزرار التواصل العائمة أسفل اليسار */
        .chat-buttons { position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 12px; z-index: 9999; }
        .chat-btn { width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; text-decoration: none; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .chat-btn:hover { transform: scale(1.1); }
        .btn-whatsapp { background-color: #25D366; }
        .btn-telegram { background-color: #0088cc; }
    </style>
</head><body>
    <header><div class="container nav"><a class="brand" href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">مكتبة الأزهري</a></div></header>
    <main>
        <!-- محتوى الصفحة الرئيسي هنا -->
    </main>

    <!-- أزرار الاتصال المحدثة والربط بحساباتك الفعالة -->
    <div class="chat-buttons">
        <!-- زر تليجرام مرتبط بحسابك -->
        <a href="https://t.me" target="_blank" class="chat-btn btn-telegram">
            <i class="fab fa-telegram-plane"></i>
        </a>
        <!-- زر واتساب مرتبط برقمك -->
        <a href="https://wa.me" target="_blank" class="chat-btn btn-whatsapp">
            <i class="fab fa-whatsapp"></i>
        </a>
    </div>
</body></html>
